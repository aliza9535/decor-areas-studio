name: Repair Decor Areas Studio project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore correct project structure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f decor-areas-studio-fixed.zip ]; then
            echo "No repair archive found; nothing to do."
            exit 0
          fi
          rm -rf /tmp/decor-areas-studio
          mkdir -p /tmp/decor-areas-studio
          unzip -q decor-areas-studio-fixed.zip -d /tmp/decor-areas-studio
          cp -R /tmp/decor-areas-studio/decor-areas-studio/. .
          rm -f callback.js pinterest.js decor-areas-studio-fixed.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project already correct."
            exit 0
          fi
          git commit -m "Restore Decor Areas Studio project structure"
          git push
